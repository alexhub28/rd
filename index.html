<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RD</title>

  <!-- p5.js (déclenche setup()) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <!-- D3.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- Ton script -->
  <script src="sketch.js"></script>

  <style>
    /* ⭐ Version compacte, dimensionnée pour tenir dans le cadre iframe
       LivingDocs (max 1000×500px) sans scroll vertical. */
    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 6px 14px;
    }

    h2 {
      margin: 0 0 4px 0;
      padding: 0;
      line-height: 1.3;
      font-weight: normal;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #chart {
      width: 100%;
      overflow-x: auto;
    }

    #legend {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 20px;
      margin-top: 6px;
      max-width: 1100px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1 1 300px;
      font-size: 10px;
      color: #222;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .legend-swatch {
      flex: none;
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }

    .legend-line {
      flex: none;
      width: 14px;
      height: 0;
      border-top: 3px solid #5A959D;
    }

  </style>
</head>

<body>

  <h2>
    Disziplinarentscheide / Décisions disciplinaires / Decisioni disciplinari
  </h2>

  <div id="chart"></div>
  <div id="legend"></div>

</body>
</html>
